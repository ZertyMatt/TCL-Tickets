<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TCL - Tickets</title>
<meta name="theme-color" content="#1a1111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://api.npoint.io" crossorigin>
<link rel="preload" href="./fonts/Google%20Sans%20Flex.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="./icons.css">
<style>
@font-face{font-family:"Google Sans Flex";src:url("./fonts/Google%20Sans%20Flex.ttf") format("truetype");font-weight:100 1000;font-stretch:25% 151%;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%;margin:0}
:root{
 --p:#ffb3ae;--onp:#68000f;--pc:#92001b;--onpc:#ffdad6;
 --s:#1a1111;--c1:#231919;--c2:#271d1d;--c3:#322828;--c4:#3d3232;
 --on:#f0dedc;--onv:#d8c2c0;--out:#a08c8b;--outv:#534341;
 --ok:#a5d6a7;--okc:#1f4a24;--err:#ffb4ab;--errc:#93000a;
 --bar:64px;--f:"Google Sans Flex",system-ui,sans-serif;
 --spring:cubic-bezier(.34,1.56,.64,1);--emph:cubic-bezier(.2,0,0,1);--ctl:52px
}
body{background:var(--s);color:var(--on);font-family:var(--f);line-height:1.45;font-size:15px;
 font-variation-settings:"wght" 400,"wdth" 100,"ROND" 60}
button,input{font-family:inherit;color:inherit}
i.ti{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001ms!important}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Verrouillage */
body.locked .bar,body.locked main,body.locked .fab,body.locked #myModal{display:none}
#lockScreen{display:none;position:fixed;inset:0;z-index:3000;align-items:center;justify-content:center;padding:1rem;background:var(--s)}
body.locked #lockScreen{display:flex}
.lock-box{width:100%;max-width:380px;background:var(--c2);border-radius:28px;padding:32px 24px;text-align:center;animation:up .4s var(--emph)}
.lock-ic{width:72px;height:72px;margin:0 auto 16px;background:var(--pc);color:var(--onpc);font-size:2rem;
 display:flex;align-items:center;justify-content:center}
.lock-box h2{margin:0 0 20px;font-size:1.4rem;font-variation-settings:"wght" 600,"wdth" 110,"ROND" 100}
.lock-box .btn{width:100%;margin-top:12px}
.lock-sep{margin:16px 0 4px;font-size:12px;color:var(--out)}
#lockMsg{min-height:1.3em;font-size:13px;margin-top:12px;color:var(--onv)}
#lockMsg.err{color:var(--err)}

/* Boutons */
.btn{height:48px;padding:0 24px;border-radius:24px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
 font-size:.95rem;background:var(--c4);color:var(--on);font-variation-settings:"wght" 560,"wdth" 100,"ROND" 100;
 transition:border-radius .25s var(--spring),transform .15s,background .2s}
.btn:hover{border-radius:14px}.btn:active{transform:scale(.96);border-radius:12px}
.btn.fill{background:var(--p);color:var(--onp)}
.btn.danger{background:var(--errc);color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--onv);font-size:1.3rem;cursor:pointer;
 display:inline-flex;align-items:center;justify-content:center;transition:background .2s,border-radius .25s var(--spring)}
.ibtn:hover{background:var(--c4);border-radius:16px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:90;height:64px;padding:0 24px 0 20px;
 border:0;border-radius:20px;background:var(--pc);color:var(--onpc);display:flex;align-items:center;gap:12px;font-size:1.05rem;cursor:pointer;
 font-variation-settings:"wght" 600,"wdth" 105,"ROND" 100;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:border-radius .3s var(--spring),transform .15s}
.fab:hover{border-radius:32px}.fab:active{transform:scale(.94)}.fab i{font-size:1.6rem}

/* Barre */
.bar{position:sticky;top:0;z-index:100;height:calc(var(--bar) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0 12px;
 display:flex;align-items:center;gap:8px;background:var(--s)}
.logo{height:44px;flex-shrink:0;display:flex}.logo svg{height:100%;width:auto}
.bar h1{margin:0;font-size:1.3rem;font-variation-settings:"wght" 560,"wdth" 108,"ROND" 100;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.bar .ibtn{width:40px;height:40px}
.sync{height:40px;padding:0 14px;border-radius:16px;display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;background:var(--c3);color:var(--onv);
 font-variation-settings:"wght" 560,"wdth" 95,"ROND" 100}
.sync.ok{background:var(--okc);color:var(--ok)}.sync.error{background:var(--errc);color:var(--err);animation:shake .4s}
.sync.saving i{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}

/* Contenu */
main{padding:4px 16px 104px;max-width:1500px;margin:0 auto}
.search{height:56px;border-radius:28px;background:var(--c3);display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;margin-bottom:16px;transition:background .2s}
.search:focus-within{background:var(--c4)}
.search i{color:var(--onv);font-size:1.3rem}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:1rem}
.search input::placeholder{color:var(--onv)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:16px}
.stat{height:88px;padding:0 16px;border-radius:28px;background:var(--c2);display:flex;align-items:center;gap:12px;animation:up .4s var(--emph) backwards}
.stat:nth-child(2){border-radius:28px 12px 28px 12px}.stat:nth-child(4){border-radius:12px 28px 12px 28px}
.stat-ic{width:44px;height:44px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:var(--ib,var(--pc));color:var(--ic,var(--onpc))}
.stat-b{display:flex;flex-direction:column;min-width:0}
.stat .l{font-size:12px;color:var(--onv);white-space:nowrap}
.stat .v{font-size:1.6rem;line-height:1.15;font-variation-settings:"wght" 700,"wdth" 118,"ROND" 100}

/* Tableau */
.tcard{background:var(--c1);border-radius:28px;overflow-x:clip}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem}
thead{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));z-index:60}
th{background:var(--c3);color:var(--onv);font-size:12px;padding:0 16px;height:52px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;
 font-variation-settings:"wght" 560,"wdth" 90,"ROND" 100}
th:first-child{border-top-left-radius:28px}th:last-child{border-top-right-radius:28px}
th:hover{color:var(--on)}th.ns{cursor:default}
.si{margin-left:4px;font-size:14px;opacity:.4}.si.active{opacity:1;color:var(--p)}
td{padding:0 16px;height:60px;border-bottom:1px solid var(--outv);vertical-align:middle}
tbody tr{transition:background .15s;cursor:pointer}
tbody tr:hover td{background:var(--c2)}
tbody tr.selected td{background:var(--pc)}
tbody tr:last-child td{border-bottom:0}
tbody tr.in{animation:up .3s ease backwards}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:10px;font-size:12px;white-space:nowrap;font-variation-settings:"wght" 560,"wdth" 95,"ROND" 100}
.chip.ok{background:var(--okc);color:var(--ok)}.chip.ko{background:var(--errc);color:var(--err)}
.zc,.ec{display:flex;align-items:center;gap:6px}
.zd{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}
.av{width:30px;height:30px;border-radius:10px;background:var(--pc);color:var(--onpc);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-variation-settings:"wght" 700}
.idc{color:var(--p);font-variation-settings:"wght" 600,"wdth" 75}
.suf{color:var(--onv);font-variation-settings:"wght" 300,"wdth" 80}
.cnt{font-variation-settings:"wght" 300,"wdth" 75}
.mut{color:var(--onv)}.id-suf{display:none}
.empty{text-align:center;padding:64px 24px;color:var(--onv)}
.empty .ei{width:80px;height:80px;margin:0 auto 16px;font-size:2rem;background:var(--c3);color:var(--p);border-radius:30% 70% 70% 30%/30% 30% 70% 70%;display:flex;align-items:center;justify-content:center}
.empty p{margin:0 0 4px;color:var(--on);font-size:1.1rem}

/* Modal */
#myModal{position:fixed;inset:0;z-index:1050;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;padding:16px;
 visibility:hidden;pointer-events:none;transition:background .25s,visibility 0s linear .3s}
#myModal.open{background:rgba(0,0,0,.55);visibility:visible;pointer-events:auto;transition:background .25s,visibility 0s}
.sheet{width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--c2);border-radius:28px;padding:24px;
 transform:scale(.92) translateY(16px);opacity:0;transition:transform .35s var(--spring),opacity .2s;overscroll-behavior:contain}
#myModal.open .sheet{transform:none;opacity:1}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.sh h5{margin:0;font-size:1.3rem;display:flex;align-items:center;gap:10px;font-variation-settings:"wght" 560,"wdth" 108,"ROND" 100}
.lab{font-size:12px;color:var(--onv);margin:0 0 6px 4px;display:block}
.fg{margin-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 2px}
.row2>.fg:first-child :is(.csb,input.fc){border-radius:16px 6px 6px 16px}
.row2>.fg:last-child :is(.csb,input.fc){border-radius:6px 16px 16px 6px}
.row2>.fg:first-child .lab{margin-left:4px}.row2>.fg:last-child .lab{margin-left:12px}
input.fc,.csb,.sufd,#idWrap,.tg{height:var(--ctl);border-radius:16px;background:var(--c3);border:2px solid transparent;font-size:.95rem;width:100%}
input.fc,.csb{padding:0 16px}
input.fc:focus,.csb:focus,#idWrap:focus-within{outline:0;border-color:var(--p);background:var(--c4)}
input.fc:disabled,.csb.dis{opacity:.5;cursor:not-allowed}
.fe{border-color:var(--err)!important;animation:shake .3s}
#idWrap{display:flex;align-items:center;overflow:hidden}
#idPre{padding:0 12px 0 16px;color:var(--onv);white-space:nowrap}
#mIdSuffix{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%;padding:0 16px 0 0;font-size:.95rem}
.sufd{display:flex;align-items:center;padding:0 16px;font-family:monospace;color:var(--p);font-size:1rem}
.err{font-size:12px;color:var(--err);margin:6px 0 0 4px;display:none}
.csw{position:relative}
.csb{cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;user-select:none;min-width:0}
.csb>span{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csb.ph{color:var(--onv)}.csb .chev{opacity:.6;transition:transform .2s}.csb.open .chev{transform:rotate(180deg)}
.dd{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:2000;background:var(--c4);border-radius:16px;max-height:240px;overflow-y:auto;padding:6px;
 opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.dd.open{opacity:1;transform:none;pointer-events:auto}
.di{min-height:44px;padding:0 12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.92rem}
.di:hover{background:var(--c3)}.di.selected{background:var(--pc);color:var(--onpc)}
.tg{display:flex;padding:4px;gap:4px}
.tg input{display:none}
.tg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;cursor:pointer;color:var(--onv);font-size:.88rem;transition:background .2s,border-radius .25s var(--spring)}
#fOui:checked+label{background:var(--okc);color:var(--ok);border-radius:20px}
#fNon:checked+label{background:var(--errc);color:var(--err);border-radius:20px}
.tg.fe{border-color:var(--err)}
.acts{display:flex;gap:2px;margin-top:24px;padding-bottom:env(safe-area-inset-bottom,0px)}
.acts .btn{height:56px;border-radius:8px;transition:border-radius .35s var(--spring),transform .15s,background .2s}
.acts .btn:first-child{border-radius:28px 8px 8px 28px}
.acts .btn:last-child{border-radius:8px 28px 28px 8px}
.acts .fill{flex:1}
.acts .btn{padding:0 16px;white-space:nowrap}
.acts #btnSupp{flex-shrink:0}
.acts .btn:hover{border-radius:28px}
.acts .btn:active{border-radius:20px;transform:scale(.97)}

/* Responsive */
@media(max-width:1100px){.tc{display:none}}
@media(max-width:900px){.lbl{display:none}}
@media(max-width:720px){
 :root{--bar:56px}
 .logo{height:38px}.bar h1{font-size:1.1rem}
 main{padding:0 12px 96px}
 .stats{grid-template-columns:1fr 1fr}
 .stat{height:72px;padding:0 12px;gap:10px;border-radius:24px!important}
 .stat-ic{width:38px;height:38px;font-size:1.15rem}.stat .v{font-size:1.35rem}.stat .l{font-size:11px}
 .fab{height:56px;padding:0 20px 0 16px}
 #myModal{align-items:flex-end;padding:0}
 .sheet{max-width:100%;border-radius:28px 28px 0 0;max-height:92dvh;padding:12px 16px 16px;transform:translateY(100%)}
 .sheet::before{content:"";display:block;width:32px;height:4px;border-radius:2px;background:var(--out);margin:0 auto 12px}
 .tcard{background:none;border-radius:0}
 table,thead,tbody,tr,th,td{display:block}thead{display:none}
 tbody tr{background:var(--c2);border-radius:24px;margin-bottom:8px;padding:4px 16px}
 tbody tr.selected{background:var(--pc)}
 tbody tr.selected td{background:none}
 td{display:flex;align-items:center;justify-content:space-between;gap:12px;height:auto;min-height:48px;padding:6px 0;border-bottom:1px dashed var(--outv)}
 tbody tr:hover td{background:none}
 td::before{content:attr(data-label);font-size:12px;color:var(--onv);flex-shrink:0}
 td:last-child{border-bottom:0;padding:8px 0 6px}td:last-child::before{content:none}
 td:last-child .btn{width:100%;height:48px}
}
</style>
</head>
<body class="locked">

<div id="lockScreen"><div class="lock-box">
 <div class="lock-ic"><i class="ti ti-lock"></i></div>
 <h2>Accès protégé</h2>
 <input type="password" id="lockPass" class="fc" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')tenterMotDePasse()">
 <button class="btn fill" id="lockBtn" onclick="tenterMotDePasse()"><i class="ti ti-lock-open"></i> Déverrouiller</button>
 <div class="lock-sep">ou</div>
 <button class="btn" onclick="scannerNFC()"><i class="ti ti-nfc"></i> Carte NFC</button>
 <div id="lockMsg"></div>
</div></div>

<header class="bar">
 <div class="logo"><svg viewBox="0 0 804 398" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd"><g transform="matrix(1,0,0,1,-1185.232032,-1281.990164)"><g transform="matrix(0,1,-2.243502,0,3848.40344,315.149584)"><path d="M1363.977,918.157L1363.977,1098.552C1363.977,1122.026 1343.056,1144.538 1305.817,1161.137C1268.579,1177.735 1218.072,1187.06 1165.409,1187.06C1055.743,1187.06 966.841,1147.434 966.841,1098.552L966.841,918.157L1165.409,828.781L1363.977,918.157Z" style="fill:#e2001a"/></g><g transform="matrix(0.173485,0,0,0.173433,712.57317,1394.882698)"><path d="M5373,234L5384,390L4904,391C4847,391 4801,436 4801,493C4802,552 4848,598 4905,598L5385,597L5374,754C5287,895 5132,988 4953,988C4682,988 4460,767 4460,493C4460,444 4468,395 4482,350L4327,350L4328,954L3936,954L3935,350L3698,350L3698,35L4564,35L4564,190C4654,74 4795,0 4953,0C5132,0 5287,93 5373,234ZM5374,754L5615,494L5373,234L5373,35L5782,35L5783,623L6137,623L6138,953L5374,954L5374,754Z" style="fill:#fff"/></g></g></svg></div>
 <h1>Tickets</h1>
 <span class="sp"></span>
 <div id="syncStatus" class="sync"><i class="ti ti-cloud"></i><span class="lbl">Synchronisé</span></div>
 <button class="ibtn" onclick="exporterJSON()" title="Exporter" aria-label="Exporter"><i class="ti ti-download"></i></button>
 <button class="ibtn" onclick="$('importFile').click()" title="Importer" aria-label="Importer"><i class="ti ti-upload"></i></button>
 <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importerJSON(this.files[0])">
</header>

<main>
 <label class="search"><i class="ti ti-search"></i><input type="search" id="searchInput" placeholder="Rechercher un suffixe, un contenu…"></label>
 <div class="stats" id="statsBar"></div>
 <div class="tcard">
  <table>
   <thead><tr>
    <th onclick="sortBy('id')">ID complet <i class="ti ti-arrows-sort si" data-col="id"></i></th>
    <th onclick="sortBy('suffixe')">Suffixe <i class="ti ti-arrows-sort si" data-col="suffixe"></i></th>
    <th onclick="sortBy('format')">Format <i class="ti ti-arrows-sort si" data-col="format"></i></th>
    <th onclick="sortBy('contenu')">Contenu <i class="ti ti-arrows-sort si" data-col="contenu"></i></th>
    <th onclick="sortBy('zones')">Zones <i class="ti ti-arrows-sort si" data-col="zones"></i></th>
    <th onclick="sortBy('quantite')">Qté <i class="ti ti-arrows-sort si" data-col="quantite"></i></th>
    <th onclick="sortBy('emprunteur')">Emprunteur <i class="ti ti-arrows-sort si" data-col="emprunteur"></i></th>
    <th onclick="sortBy('fonctionnel')">État <i class="ti ti-arrows-sort si" data-col="fonctionnel"></i></th>
    <th onclick="sortBy('ajoute')">Ajouté le <i class="ti ti-arrows-sort si" data-col="ajoute"></i></th>
    <th class="ns"></th>
   </tr></thead>
   <tbody id="ticketBody"></tbody>
  </table>
  <div id="emptyState" class="empty" style="display:none">
   <div class="ei"><i class="ti ti-ticket-off"></i></div>
   <p>Aucun ticket enregistré</p><span class="mut">Ajoutez votre premier ticket avec le bouton +.</span>
  </div>
 </div>
</main>

<button class="fab" onclick="ouvrirModal()" aria-label="Ajouter un ticket"><i class="ti ti-plus"></i><span>Ajouter</span></button>

<div id="myModal"><div class="sheet">
 <div class="sh">
  <h5 id="modalTitle"><i class="ti ti-ticket"></i> Nouveau ticket</h5>
  <button class="ibtn" onclick="fermerModal()" aria-label="Fermer"><i class="ti ti-x"></i></button>
 </div>
 <input type="hidden" id="editIndex">
 <div class="fg">
  <label class="lab">Numéro de ticket <span id="idCounter">(0/12 chiffres)</span></label>
  <div id="idWrap"><span id="idPre">06-14988599</span><input type="text" id="mIdSuffix" placeholder="000000000000" maxlength="12" inputmode="numeric" oninput="onIdInput(this)"></div>
  <input type="hidden" id="mId"><div id="idError" class="err"></div>
 </div>
 <div class="fg">
  <label class="lab">Suffixe (caractères 18–23)</label>
  <div class="sufd" id="mSuffixeDisplay">—</div><input type="hidden" id="mSuffixe">
 </div>
 <div class="row2">
  <div class="fg"><label class="lab">Contenu</label><div class="csw">
   <button type="button" class="csb ph" id="btnContenu" onclick="toggleDropdown('Contenu')"><span id="lblContenu">Sélectionner…</span><i class="ti ti-chevron-down chev"></i></button>
   <div class="dd" id="dropContenu"></div><input type="hidden" id="mContenu"></div></div>
  <div class="fg"><label class="lab">Format</label><div class="csw">
   <button type="button" class="csb ph" id="btnFormat" onclick="toggleDropdown('Format')"><span id="lblFormat">Sélectionner…</span><i class="ti ti-chevron-down chev"></i></button>
   <div class="dd" id="dropFormat"></div><input type="hidden" id="mFormat"></div></div>
 </div>
 <div class="row2">
  <div class="fg"><label class="lab">Zones</label><div class="csw">
   <button type="button" class="csb ph" id="btnZones" onclick="toggleDropdown('Zones')"><span id="lblZones">Sélectionner…</span><i class="ti ti-chevron-down chev"></i></button>
   <div class="dd" id="dropZones"></div><input type="hidden" id="mZones"></div></div>
  <div class="fg"><label class="lab">Quantité</label>
   <input type="number" id="mQte" placeholder="ex. 10" class="fc" min="1" inputmode="numeric">
   <div id="qteError" class="err">Quantité requise</div></div>
 </div>
 <div class="fg"><label class="lab">Emprunteur</label><input type="text" id="mEmp" placeholder="— si non emprunté" class="fc"></div>
 <div class="fg"><label class="lab">État</label>
  <div class="tg" id="toggleGroup">
   <input type="radio" name="mFonctionnel" id="fOui" value="oui"><label for="fOui"><i class="ti ti-check"></i> Fonctionnel</label>
   <input type="radio" name="mFonctionnel" id="fNon" value="non"><label for="fNon"><i class="ti ti-x"></i> Non fonctionnel</label>
  </div>
  <div id="foncError" class="err">Veuillez sélectionner une option</div>
 </div>
 <div class="mut" id="dateInfo" style="font-size:12px;margin:-4px 0 0 4px;display:none"></div>
 <div class="acts">
  <button class="btn fill" onclick="sauvegarder()"><i class="ti ti-device-floppy"></i> Enregistrer</button>
  <button id="btnSupp" class="btn danger" onclick="confirmerSuppression(event)" style="display:none"><i class="ti ti-trash"></i> Supprimer</button>
  <button class="btn" onclick="fermerModal()">Annuler</button>
 </div>
</div></div>

<script>
const API_URL='https://api.npoint.io/31ba31f685940c724c54', PREFIX='06-14988599', VAR_LEN=12;
let tickets=[], sortColumn='id', sortDirection='asc', statsInit=false, firstRender=true;
const $=id=>document.getElementById(id);

/* Tarifs TCL (€) : [Zones 1-2, 2 zones voisines, Toutes zones sauf Z1, Toutes zones]. Titres à voyages : prix PAR VOYAGE. */
const D=(a,n)=>a.map(v=>+(v/n).toFixed(4)), F=v=>[v,v,v,v];
const PRIX={
 '1 voyage':[2.1,1.6,2.5,3.7], '1 voyage à bord':[2.6,1.8,2.7,3.9],
 '10 voyages':D([20.5,14.2,22.4,33.6],10),
 '10 voyages (-26 ans/étudiants)':D([17.4,12.1,19,28.6],10),
 '10 voyages famille nombreuse':D([15.4,10.7,16.8,25.1],10),
 'Pass 24h':[7.1,5.4,8.4,9.9], 'Pass 48h':[13.2,10.2,15.9,18.8], 'Pass 72h':[18.5,14,22.1,26.1],
 'Pass 7 jours':[23.8,18.1,28.4,33.6], 'Pass tribu':[7.3,5.4,8.4,9.9],
 'Groupe 10 personnes':[1.7,1.1,1.8,2.8],
 'Aller simple Navigône':F(3), 'Aller-retour Navigône':F(5), 'Aller-retour Funiculaire':F(3.7),
 'Pass TCL en fête':F(3.7), 'Pass Pic Pollution':[3.5,4.5,4.5,4.5]
};
const zcol=z=>z==='Z1 & 2'?0:z==='Toutes zones sauf Z1'?2:z==='Toutes zones'?3:(z&&z!=='—')?1:-1;
const SUPPORT_PRIX=0.2;
function gain(t){
    if(t.fonctionnel!=='oui')return 0;
    const q=parseInt(t.quantite,10), p=PRIX[t.contenu], c=zcol(t.zones);
    return ((p&&q>0&&c>=0)?q*p[c]:0)+SUPPORT_PRIX;
}
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const fmtDate=iso=>{const d=iso&&new Date(iso);return d&&!isNaN(d)?d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'—';};
const fmtDateHeure=iso=>{const d=iso&&new Date(iso);return d&&!isNaN(d)?d.toLocaleString('fr-FR',{dateStyle:'long',timeStyle:'short'}):'';};

const DROPDOWN_DATA={
 Contenu:['Vide','Inconnu','1 voyage','1 voyage à bord','10 voyages','10 voyages (-26 ans/étudiants)','10 voyages famille nombreuse','Pass 24h','Pass 48h','Pass 72h','Pass 7 jours','Pass tribu','Groupe 10 personnes','Aller simple Navigône','Aller-retour Navigône','Aller-retour Funiculaire','Pass TCL en fête','Pass Pic Pollution'],
 Format:[{v:'DAB',c:'#E2001A'},{v:'Rose Bus',c:'#e91e8c'},{v:'Bleu Bus',c:'#1a56c4'},{v:'Orange Bus',c:'#e07b00'},{v:'Vert Bus',c:'#2e7d32'},{v:'Agence',c:'#E2001A'},{v:'Paris 2024',c:'#1a56c4'},{v:'Rectangle',c:'#E2001A'}],
 Zones:[{v:'Z1 & 2',dots:['#E2001A','#e07b00']},{v:'Z2 & 3',dots:['#e07b00','#2e7d32']},{v:'Z3 & 4',dots:['#2e7d32','#1a56c4']},{v:'Z4 & 5',dots:['#1a56c4','#e91e8c']},{v:'Z2 & EXT',dots:['#e07b00','#f5c518']},{v:'Z3 & EXT',dots:['#2e7d32','#f5c518']},{v:'Z4 & EXT',dots:['#1a56c4','#f5c518']},{v:'Z5 & EXT',dots:['#e91e8c','#f5c518']},{v:'Toutes zones sauf Z1',dots:['#7c3aed','#E2001A']},{v:'Toutes zones',dots:['#7c3aed']}]
};
const ZONE_MAP=Object.fromEntries(DROPDOWN_DATA.Zones.map(z=>[z.v,z.dots]));
const FORMAT_COLOR=Object.fromEntries(DROPDOWN_DATA.Format.map(f=>[f.v,f.c]));
const dot=c=>`<span class="zd" style="background:${c}"></span>`;
const zonesDots=v=>(ZONE_MAP[v]||[]).map(dot).join('');

function buildDropdowns(){
    for(const name of ['Contenu','Format','Zones']){
        const drop=$('drop'+name), frag=document.createDocumentFragment();
        const ph=document.createElement('div');
        ph.className='di';ph.textContent='Sélectionner…';ph.style.cssText='opacity:.5;pointer-events:none';
        frag.appendChild(ph);
        DROPDOWN_DATA[name].forEach(item=>{
            const el=document.createElement('div'), v=typeof item==='string'?item:item.v;
            el.className='di';el.onclick=()=>selectOption(name,v);
            if(typeof item==='string')el.textContent=item;
            else if(name==='Format')el.innerHTML=dot(item.c)+v;
            else el.innerHTML=item.dots.map(dot).join('')+v;
            frag.appendChild(el);
        });
        drop.appendChild(frag);
    }
}
function formatChip(v){
    const c=FORMAT_COLOR[v]||'#E2001A';
    return `<span class="chip" style="background:${c}33;color:#fff;box-shadow:inset 0 0 0 1px ${c}88"><span class="zd" style="background:${c}"></span>${v||'—'}</span>`;
}

const SYNC_ICONS={idle:'ti-cloud',saving:'ti-cloud-upload',ok:'ti-cloud-check',error:'ti-cloud-x'};
function setSync(state,msg){
    const el=$('syncStatus');
    el.className='sync '+state;
    el.innerHTML=`<i class="ti ${SYNC_ICONS[state]}"></i><span class="lbl">${msg}</span>`;
}

function animateNumber(el,to){
    const from=parseInt(el.dataset.val||'0',10)||0;
    el.dataset.val=to;
    if(from===to){el.textContent=to;return;}
    const start=performance.now();
    (function step(now){
        const p=Math.min((now-start)/400,1), e=1-Math.pow(1-p,3);
        el.textContent=Math.round(from+(to-from)*e);
        if(p<1)requestAnimationFrame(step);
    })(start);
}

function renderStats(){
    const totalQte=tickets.reduce((s,t)=>s+(parseInt(t.quantite)||0),0);
    const nbOk=tickets.filter(t=>t.fonctionnel==='oui').length;
    const nbKo=tickets.filter(t=>t.fonctionnel==='non').length;
    const eco=eur(Math.round(tickets.reduce((s,t)=>s+gain(t),0)*100)/100);
    if(!statsInit){
        const S=(ic,l,id,v,bg,fg)=>`<div class="stat"><div class="stat-ic" style="--ib:${bg};--ic:${fg}"><i class="ti ti-${ic}"></i></div><div class="stat-b"><div class="l">${l}</div><div class="v" id="${id}">${v}</div></div></div>`;
        $('statsBar').innerHTML=
            S('ticket','Tickets','statTotal',0,'var(--pc)','var(--onpc)')+
            S('route','Total voyages','statVoyages',0,'#1c3a6b','#adc6ff')+
            S('check','Fonctionnels','statOk',0,'var(--okc)','var(--ok)')+
            S('alert-triangle','Non fonctionnels','statKo',0,'var(--errc)','var(--err)')+
            S('wallet','Économies','statEco','0,00 €','var(--okc)','var(--ok)');
        statsInit=true;
    }
    animateNumber($('statTotal'),tickets.length);
    animateNumber($('statVoyages'),totalQte);
    animateNumber($('statOk'),nbOk);
    animateNumber($('statKo'),nbKo);
    $('statEco').textContent=eco;
}

/* Cache local puis rafraîchissement depuis l'API */
async function charger(){
    try{const c=JSON.parse(localStorage.getItem('mesTickets'));if(Array.isArray(c)){tickets=c;render();}}catch{}
    setSync('saving','Chargement…');
    try{
        const r=await fetch(API_URL);
        if(!r.ok)throw 0;
        const j=await r.json();
        tickets=Array.isArray(j)?j:(j.data||[]);
        localStorage.setItem('mesTickets',JSON.stringify(tickets));
        setSync('ok','Synchronisé');
    }catch{setSync('error','Hors ligne');}
    render();
}
async function sauvegarderAPI(){
    setSync('saving','Sauvegarde…');
    localStorage.setItem('mesTickets',JSON.stringify(tickets));
    try{
        const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(tickets)});
        if(!r.ok)throw 0;
        setSync('ok','Synchronisé');
    }catch{setSync('error','Erreur sync');}
}
function exporterJSON(){
    const url=URL.createObjectURL(new Blob([JSON.stringify(tickets,null,2)],{type:'application/json'}));
    const a=document.createElement('a');
    a.href=url;a.download=`tickets-tcl-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importerJSON(file){
    if(!file)return;
    const reader=new FileReader();
    reader.onload=async e=>{
        let data;
        try{data=JSON.parse(e.target.result);}catch{alert('Fichier JSON invalide.');return;}
        const liste=Array.isArray(data)?data:(data.data||null);
        if(!Array.isArray(liste)){alert('Format invalide.');return;}
        if(!confirm(`Écraser les ${tickets.length} ticket(s) par les ${liste.length} ticket(s) ?`))return;
        tickets=liste;await sauvegarderAPI();render();
    };
    reader.readAsText(file);
}

/* ---------- Listes déroulantes ---------- */
function closeAllDropdowns(except){
    ['Format','Zones','Contenu'].forEach(n=>{
        if(n===except)return;
        $('drop'+n).classList.remove('open');$('btn'+n).classList.remove('open');
    });
}
function toggleDropdown(name){
    const btn=$('btn'+name), drop=$('drop'+name);
    if(btn.classList.contains('dis'))return;
    const open=drop.classList.contains('open');
    closeAllDropdowns(null);
    if(!open){drop.classList.add('open');btn.classList.add('open');}
}
function selectOption(name,value){
    const lbl=$('lbl'+name), btn=$('btn'+name), drop=$('drop'+name);
    $('m'+name).value=value;
    if(name==='Zones'&&value)lbl.innerHTML=zonesDots(value)+`<span>${value}</span>`;
    else if(name==='Format'&&value)lbl.innerHTML=dot(FORMAT_COLOR[value]||'#E2001A')+`<span>${value}</span>`;
    else lbl.textContent=value||'Sélectionner…';
    btn.classList.toggle('ph',!value);
    btn.classList.remove('fe');
    drop.querySelectorAll('.di').forEach((el,i)=>{if(i)el.classList.toggle('selected',el.textContent.trim()===value&&!!value);});
    drop.classList.remove('open');btn.classList.remove('open');
    if(name==='Contenu')onContenuChange(value);
}
const setDropdownValue=selectOption;
function setDropdownDisabled(name,disabled,shown){
    const btn=$('btn'+name);
    if(disabled){
        btn.classList.add('dis');
        $('m'+name).value=shown??'—';$('lbl'+name).textContent=shown??'—';
        btn.classList.remove('ph','fe');
        $('drop'+name).classList.remove('open');
    }else btn.classList.remove('dis');
}
document.addEventListener('click',e=>{if(!e.target.closest('.csw'))closeAllDropdowns(null);});

function onContenuChange(value){
    if(document.querySelector('input[name="mFonctionnel"]:checked')?.value==='non')return;
    const vide=value==='Vide', inc=value==='Inconnu', q=$('mQte');
    setDropdownDisabled('Zones',vide||inc,'—');
    if(vide){q.value='0';q.disabled=true;q.classList.remove('fe');}
    else if(inc){q.value='—';q.disabled=true;q.classList.remove('fe');}
    else{q.disabled=false;if(q.value==='0'||q.value==='—')q.value='';}
}
function setNonFoncMode(isNon){
    const q=$('mQte'), c=$('mContenu'), z=$('mZones');
    $('toggleGroup').classList.remove('fe');$('foncError').style.display='none';
    if(isNon){
        c.dataset.prev=c.value;z.dataset.prev=z.value;q.dataset.prev=q.value;
        setDropdownDisabled('Contenu',true,'—');setDropdownDisabled('Zones',true,'—');
        q.value='—';q.disabled=true;q.classList.remove('fe');
    }else{
        setDropdownDisabled('Contenu',false);setDropdownDisabled('Zones',false);
        q.disabled=false;
        if(c.value==='—')setDropdownValue('Contenu',c.dataset.prev||'');
        if(z.value==='—')setDropdownValue('Zones',z.dataset.prev||'');
        if(q.value==='—')q.value=q.dataset.prev||'';
        onContenuChange(c.value);
    }
}
document.querySelectorAll('input[name="mFonctionnel"]').forEach(r=>r.addEventListener('change',function(){setNonFoncMode(this.value==='non');}));

/* Saisie du numéro : longueur + doublon vérifiés en direct */
function onIdInput(el){
    el.value=el.value.replace(/\D/g,'').slice(0,VAR_LEN);
    const n=el.value.length, full=PREFIX+el.value, editIdx=parseInt($('editIndex').value);
    const dup=n===VAR_LEN&&tickets.some((t,i)=>t.id===full&&i!==editIdx);
    const err=dup||(n>0&&n<VAR_LEN);
    $('idCounter').textContent=`(${n}/${VAR_LEN} chiffres)`;
    const errEl=$('idError');
    errEl.style.display=err?'block':'none';
    errEl.textContent=dup?'Ce numéro existe déjà':(err?'12 chiffres requis':'');
    $('idWrap').classList.toggle('fe',err);
    $('mId').value=full;
    const s=full.length>17?full.slice(17,23):'';
    $('mSuffixe').value=s;$('mSuffixeDisplay').textContent=s||'—';
}

function resetModal(){
    $('mIdSuffix').value='';$('mId').value='';
    $('idCounter').textContent=`(0/${VAR_LEN} chiffres)`;
    $('mSuffixe').value='';$('mSuffixeDisplay').textContent='—';
    $('idError').style.display='none';$('idWrap').classList.remove('fe');
    const q=$('mQte');q.value='';q.disabled=false;q.classList.remove('fe');
    $('qteError').style.display='none';$('mEmp').value='';
    document.querySelectorAll('input[name="mFonctionnel"]').forEach(r=>r.checked=false);
    $('toggleGroup').classList.remove('fe');$('foncError').style.display='none';
    $('dateInfo').style.display='none';
    setDropdownDisabled('Contenu',false);setDropdownValue('Contenu','');
    setDropdownDisabled('Zones',false);setDropdownValue('Zones','');
    setDropdownValue('Format','');
    delete $('mContenu').dataset.prev;delete $('mZones').dataset.prev;delete q.dataset.prev;
    closeAllDropdowns(null);
}

function ouvrirModal(index=-1){
    $('editIndex').value=index;
    $('btnSupp').style.display=index===-1?'none':'inline-flex';
    $('modalTitle').innerHTML=index===-1?'<i class="ti ti-ticket"></i> Nouveau ticket':'<i class="ti ti-edit"></i> Modifier le ticket';
    resetModal();
    if(index!==-1){
        const t=tickets[index], varPart=t.id.startsWith(PREFIX)?t.id.slice(PREFIX.length):t.id;
        $('mIdSuffix').value=varPart;$('mId').value=t.id;
        $('idCounter').textContent=`(${varPart.length}/${VAR_LEN} chiffres)`;
        $('mSuffixe').value=t.suffixe;$('mSuffixeDisplay').textContent=t.suffixe||'—';
        setDropdownValue('Format',t.format||'');
        $('mEmp').value=t.emprunteur==='—'?'':(t.emprunteur||'');
        if(t.fonctionnel){const r=document.querySelector(`input[name="mFonctionnel"][value="${t.fonctionnel}"]`);if(r)r.checked=true;}
        if(t.fonctionnel==='non')setNonFoncMode(true);
        else{
            setDropdownValue('Contenu',t.contenu||'');setDropdownValue('Zones',t.zones||'');
            $('mQte').value=t.quantite||'';onContenuChange(t.contenu||'');
        }
        const di=fmtDateHeure(t.ajoute);
        if(di){$('dateInfo').textContent='Ajouté le '+di;$('dateInfo').style.display='block';}
    }
    requestAnimationFrame(()=>$('myModal').classList.add('open'));
}
function fermerModal(){$('myModal').classList.remove('open');closeAllDropdowns(null);}
$('myModal').addEventListener('click',function(e){if(e.target===this)fermerModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fermerModal();});

function confirmerSuppression(event){
    if(!event.shiftKey&&!confirm('Êtes-vous sûr de vouloir supprimer ce ticket ?\n\nMaintenez Shift + clic pour supprimer sans confirmation.'))return;
    supprimer();
}

function sauvegarder(){
    const varPart=$('mIdSuffix').value, editIndex=parseInt($('editIndex').value), fullId=$('mId').value;
    const lenBad=varPart.length!==VAR_LEN, dup=tickets.some((t,i)=>t.id===fullId&&i!==editIndex);
    let bad=(lenBad||dup)?$('idWrap'):null;
    const flag=(el,cond)=>{el.classList.toggle('fe',cond);if(cond&&!bad)bad=el;};
    const idErr=$('idError');
    idErr.textContent=dup?'Ce numéro existe déjà':'12 chiffres requis';
    idErr.style.display=(lenBad||dup)?'block':'none';
    $('idWrap').classList.toggle('fe',lenBad||dup);

    const format=$('mFormat').value, contenu=$('mContenu').value, zones=$('mZones').value;
    flag($('btnFormat'),!format);
    flag($('btnContenu'),!$('btnContenu').classList.contains('dis')&&!contenu);
    flag($('btnZones'),!$('btnZones').classList.contains('dis')&&!zones);

    const q=$('mQte');let qBad=false;
    if(!q.disabled){const v=q.value.trim();qBad=!(v&&!isNaN(v)&&parseInt(v)>=1);}
    $('qteError').style.display=qBad?'block':'none';flag(q,qBad);

    const fonctionnel=document.querySelector('input[name="mFonctionnel"]:checked')?.value||'';
    $('foncError').style.display=fonctionnel?'none':'block';
    flag($('toggleGroup'),!fonctionnel);

    if(bad){bad.scrollIntoView({behavior:'smooth',block:'center'});return;}

    const isNon=fonctionnel==='non', ticket={
        id:fullId, suffixe:$('mSuffixe').value, format,
        contenu:isNon?'—':contenu, zones:isNon?'—':zones, quantite:isNon?'—':q.value,
        emprunteur:$('mEmp').value.trim()||'—', fonctionnel,
        /* Date d'ajout automatique : posée à la création, conservée ensuite */
        ajoute:editIndex===-1?new Date().toISOString():(tickets[editIndex].ajoute||'')
    };
    if(editIndex===-1)tickets.push(ticket);else tickets[editIndex]=ticket;
    sauvegarderAPI();fermerModal();render();
}
function supprimer(){
    tickets.splice(parseInt($('editIndex').value),1);
    sauvegarderAPI();fermerModal();render();
}

function sortBy(col){
    sortDirection=sortColumn===col?(sortDirection==='asc'?'desc':'asc'):'asc';
    sortColumn=col;render();
}
function getTicketsTries(){
    const q=$('searchInput').value.toLowerCase();
    let rows=tickets.map((t,i)=>({t,i}));
    if(q)rows=rows.filter(({t})=>[t.suffixe,t.contenu,t.id,t.emprunteur].some(v=>(v||'').toLowerCase().includes(q)));
    const num=v=>(v==='—'||!v||isNaN(v))?-Infinity:parseFloat(v);
    rows.sort((a,b)=>{
        const va=a.t[sortColumn], vb=b.t[sortColumn];
        const c=sortColumn==='quantite'?num(va)-num(vb):(va??'').toString().localeCompare((vb??'').toString(),'fr',{numeric:true,sensitivity:'base'});
        return sortDirection==='asc'?c:-c;
    });
    return rows;
}
function majIconesTri(){
    document.querySelectorAll('.si').forEach(icon=>{
        const on=icon.dataset.col===sortColumn;
        icon.className='ti si '+(on?(sortDirection==='asc'?'ti-sort-ascending':'ti-sort-descending')+' active':'ti-arrows-sort');
    });
}

const initials=n=>(!n||n==='—')?'—':n.trim().split(/\s+/).map(w=>w[0].toUpperCase()).slice(0,2).join('');
function etatChip(v){
    if(v==='oui')return '<span class="chip ok"><i class="ti ti-check"></i><span class="tc">Fonctionnel</span></span>';
    if(v==='non')return '<span class="chip ko"><i class="ti ti-x"></i><span class="tc">Non fonctionnel</span></span>';
    return '<span class="mut">—</span>';
}

function render(){
    renderStats();majIconesTri();
    const rows=getTicketsTries(), tbody=$('ticketBody');
    $('emptyState').style.display=rows.length?'none':'block';
    const anim=firstRender&&rows.length;
    tbody.innerHTML=rows.map(({t,i},idx)=>{
        const g=gain(t), tip=g?` title="Valeur : ${eur(g)}"`:'';
        return `<tr${anim?` class="in" style="animation-delay:${Math.min(idx*25,300)}ms"`:''} onclick="toggleSelectRow(this,event)">
        <td class="idc" data-label="ID complet">${t.id||'—'}</td>
        <td class="suf" data-label="Suffixe">${t.suffixe||'—'}</td>
        <td data-label="Format">${formatChip(t.format)}</td>
        <td class="cnt" data-label="Contenu">${t.contenu||'—'}</td>
        <td data-label="Zones"><div class="zc">${zonesDots(t.zones)}<span class="mut">${t.zones||'—'}</span></div></td>
        <td data-label="Qté" style="font-weight:600"${tip}>${t.quantite||'—'}</td>
        <td data-label="Emprunteur"><div class="ec">${t.emprunteur&&t.emprunteur!=='—'?`<div class="av">${initials(t.emprunteur)}</div><span>${t.emprunteur}</span>`:'<span class="mut">—</span>'}</div></td>
        <td data-label="État">${etatChip(t.fonctionnel)}</td>
        <td class="mut" data-label="Ajouté le" title="${fmtDateHeure(t.ajoute)}" style="white-space:nowrap">${fmtDate(t.ajoute)}</td>
        <td><button class="btn" style="height:40px;padding:0 16px" onclick="ouvrirModal(${i})" aria-label="Éditer"><i class="ti ti-edit"></i><span class="tc">Éditer</span></button></td></tr>`;
    }).join('');
    if(rows.length)firstRender=false;
}
function toggleSelectRow(tr,e){
    if(e.target.closest('.btn'))return;
    const was=tr.classList.contains('selected');
    document.querySelectorAll('#ticketBody tr.selected').forEach(r=>r.classList.remove('selected'));
    if(!was)tr.classList.add('selected');
}

/* Recherche débouncée */
let st;
$('searchInput').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(render,150);});

/* ---------- Accès : mot de passe OU carte NFC ----------
   Empreintes injectées au déploiement (GitHub Actions) depuis les secrets SafetyPassCode et NFCacess. */
const AUTH={pass:'__SAFETYPASSCODE__',nfc:'__NFCACCESS__'}, AUTH_SALT='gestion-tcl-v1';
let started=false, nfcAbort=null, echecs=0;

async function derive(v){
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',enc.encode(v),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(AUTH_SALT),iterations:200000,hash:'SHA-256'},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function lockMsg(txt,err){const m=$('lockMsg');m.textContent=txt;m.classList.toggle('err',!!err);}
function deverrouiller(hash){
    sessionStorage.setItem('tclAuth',hash);
    if(nfcAbort)nfcAbort.abort();
    document.body.classList.remove('locked');
    $('lockPass').value='';lockMsg('');
    if(!started){started=true;charger();}
}
async function verifier(valeur,type){
    const attendu=AUTH[type];
    if(!attendu||attendu.startsWith('__')){lockMsg('Accès non configuré (secret manquant au déploiement).',true);return;}
    if(!(window.crypto&&crypto.subtle)){lockMsg('Contexte non sécurisé : ouvrez la page en HTTPS.',true);return;}
    const h=await derive(type+':'+valeur);
    if(h===attendu){echecs=0;deverrouiller(h);return;}
    echecs++;
    lockMsg(type==='pass'?'Mot de passe incorrect':'Carte non reconnue',true);
    const btn=$('lockBtn');btn.disabled=true;
    setTimeout(()=>{btn.disabled=false;},Math.min(echecs,5)*1000);
}
function tenterMotDePasse(){
    if($('lockBtn').disabled)return;
    const v=$('lockPass').value;
    if(v)verifier(v,'pass');
}
async function scannerNFC(){
    if(!('NDEFReader' in window)){lockMsg('NFC indisponible ici (Chrome sur Android, en HTTPS, requis).',true);return;}
    try{
        if(nfcAbort)nfcAbort.abort();
        nfcAbort=new AbortController();
        const ndef=new NDEFReader();
        ndef.onreading=e=>verifier(e.serialNumber.toLowerCase().replace(/[^0-9a-f]/g,''),'nfc');
        await ndef.scan({signal:nfcAbort.signal});
        lockMsg('Approchez la carte du téléphone…');
    }catch(err){lockMsg('Lecture NFC impossible : '+err.message,true);}
}
function initAuth(){
    const s=sessionStorage.getItem('tclAuth');
    if(s&&!s.startsWith('__')&&(s===AUTH.pass||s===AUTH.nfc))deverrouiller(s);
}

/* Forme « cookie » M3E (9 lobes) partagée par le verrou et le bouton Supprimer */
const cookie=(n=9,a=.075)=>'polygon('+Array.from({length:240},(_,i)=>{const t=i/240*2*Math.PI,r=46*(1+a*Math.cos(n*t));return (50+r*Math.cos(t)).toFixed(2)+'% '+(50+r*Math.sin(t)).toFixed(2)+'%';}).join(',')+')';
document.querySelectorAll('.lock-ic').forEach(e=>e.style.clipPath=cookie());
buildDropdowns();
initAuth();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
